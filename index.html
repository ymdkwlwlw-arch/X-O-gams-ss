.mk{width:56%;height:56%;fill:none;stroke:currentColor;stroke-width:4.5;stroke-linecap:round}

  click(el){const i=+el.dataset.i;if(lock||on.has(i)||ok.has(i))return;on.add(i);open.push(i);sfx("flip");draw();

/* ===== كاسح الألغام (جديد) ===== */
function mineStart(){
 const N=9,M=10,my=tk;let m=null,op=Array(81).fill(0),fg=Array(81).fill(0),flag=false,over=false,t0=0,fin=0,iv=0;
 const nb=i=>{const r=i/N|0,c=i%N,o=[];for(let a=-1;a<2;a++)for(let b=-1;b<2;b++){const y=r+a,x=c+b;if((a||b)&&y>=0&&x>=0&&y<N&&x<N)o.push(y*N+x)}return o};
 const num=i=>nb(i).filter(j=>m[j]).length;
 const secs=()=>fin||(t0?Math.floor((Date.now()-t0)/1000):0);
 const draw=()=>{$("#stage").innerHTML=`<div class="mn">${op.map((v,i)=>`<button class="cell${v?" op":""}" data-i="${i}" ${v||over?"disabled":""} aria-label="${i+1}">${v?(m[i]?"&#128163;":num(i)?`<span style="color:hsl(${num(i)*55+170} 80% 65%)">${num(i)}</span>`:""):fg[i]?"&#128681;":""}</button>`).join("")}</div><button class="btn" style="width:100%;margin-top:8px" data-i="f">${flag?"&#128681;":"&#9935;"} ${t("flagmode")}${flag?" ✓":""}</button>`};
 const place=s=>{m=Array(81).fill(0);let k=0;while(k<M){const i=Math.floor(Math.random()*81);if(!m[i]&&i!==s&&!nb(s).includes(i)){m[i]=1;k++}}};
 const flood=i=>{const s=[i];while(s.length){const k=s.pop();if(op[k]||fg[k])continue;op[k]=1;if(!m[k]&&!num(k))nb(k).forEach(j=>s.push(j))}};
 const stop=w=>{over=true;clearInterval(iv);fin=secs();const s=sc("mine");s.a++;if(w&&(!s.best||fin<s.best))s.best=fin;saveSc();
  if(!w)m.forEach((v,j)=>{if(v)op[j]=1});draw();setSt(w?`&#127881; ${fin}s`:`&#128165; ${t("over")}`);sfx(w?"win":"lose");record(w?"a":"b");sb()};
 setSt(t("mn"));draw();
 return{stats:()=>[[t("mines"),M-fg.reduce((a,b)=>a+b,0)],[t("time"),secs()],[t("best"),sc("mine").best||"-"]],
  click(el){const k=el.dataset.i;if(over)return;
   if(k==="f"){flag=!flag;draw();return}
   const i=+k;if(op[i])return;
   if(flag){fg[i]^=1;sfx("tick");draw();sb();return}
   if(fg[i])return;
   if(!m){place(i);t0=Date.now();iv=setInterval(()=>{if(over||my!==tk)clearInterval(iv);else sb()},1000)}
   if(m[i]){op[i]=1;stop(false);return}
   flood(i);sfx("flip");draw();sb();
   if(op.filter(Boolean).length===81-M)stop(true)}}}

/* ===== 2048 ===== */
function g2048Start(){
 let g=Array(16).fill(0),score=0,over=false;
 const add=()=>{const e=[];g.forEach((v,i)=>{if(!v)e.push(i)});if(e.length)g[rnd(e)]=Math.random()<.9?2:4};
 const draw=()=>{$("#stage").innerHTML=`<div class="sw"><div class="t48">${g.map(v=>`<b${v?` style="background:hsl(${(Math.log2(v)*32+20)%360} 85% 62%)"`:""}>${v||""}</b>`).join("")}</div></div>`};
 const can=()=>g.includes(0)||g.some((v,i)=>(i%4<3&&v===g[i+1])||(i<12&&v===g[i+4]));
 const ix=(d,k,j)=>d===3?k*4+j:d===1?k*4+3-j:d===0?j*4+k:(3-j)*4+k;
 const move=d=>{if(over)return;let ch=false,gain=0;
  for(let k=0;k<4;k++){const r=[0,1,2,3].map(j=>g[ix(d,k,j)]).filter(Boolean);
   for(let i=0;i<r.length-1;i++)if(r[i]===r[i+1]){r[i]*=2;gain+=r[i];r.splice(i+1,1)}
   while(r.length<4)r.push(0);r.forEach((v,j)=>{if(g[ix(d,k,j)]!==v)ch=true;g[ix(d,k,j)]=v})}
  if(!ch)return;score+=gain;add();draw();sfx(gain?"merge":"tick");const s=sc("g2048");if(score>s.best){s.best=score;saveSc()}
  if(!can()){over=true;s.a++;saveSc();setSt(`${t("over")} · ${score}`);sfx("lose");award(Math.min(40,Math.round(score/40)))}sb()};
 add();add();draw();setSt(t("swipe"));
 return{swipe:move,stats:()=>[[t("score"),score],[t("best"),Math.max(sc("g2048").best||0,score)],[t("games"),sc("g2048").a]]}}

const ACT={enter(){scr="hub";daily();sfx("lvl");render()},test(){sfx("lvl");toast(t("sndHint"))},reset:start,menu(){S.game=null;render()},hint(){cur&&cur.hint&&cur.hint()},undo(){cur&&cur.undo&&cur.undo()},
 forget(){delete MD[S.game];saveMd();render()},
 install(){if(dip){dip.prompt();dip=null}else toast(t("installHint"))},
 share(){const x=`KOLO ARCADE · ${t("plv")} ${lvOf(PF.xp)} · ${PF.xp} XP · ${t("st_wins")} ${PF.wins}\n${style().join(" · ")}\nڪولو سآن`;
  if(navigator.share)navigator.share({title:"KOLO ARCADE",text:x}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(x).then(()=>toast(t("copied")),()=>{})}};
document.addEventListener("click",e=>{const q=s=>e.target.closest(s);let x;
 if(x=q("[data-g]")){S.game=x.dataset.g;sfx("p1");render();return}
 if(x=q("[data-mode]")){S.mode=x.dataset.mode;pref();render();return}
 if((x=q("[data-th]"))&&!x.disabled){S.theme=x.dataset.th;pref();sfx("p1");render();return}
 if((x=q("[data-act]"))&&ACT[x.dataset.act]){ACT[x.dataset.act]();return}
 if((x=q("#stage [data-i]"))&&cur&&cur.click)cur.click(x)});
document.addEventListener("change",e=>{const x=e.target;
 if(x.matches("[data-lv]")){S.level=x.value;pref();render()}
 if(x.matches("[data-sts]")){S.starter=x.value;pref();start()}
 if(x.matches("[data-mercy]")){S.mercy=x.checked;pref();render()}});
let tp=null;
document.addEventListener("touchstart",e=>{tp=e.target.closest(".sw")?[e.touches[0].clientX,e.touches[0].clientY]:null},{passive:true});
document.addEventListener("touchend",e=>{if(!tp||!cur||!cur.swipe)return;const c=e.changedTouches[0],dx=c.clientX-tp[0],dy=c.clientY-tp[1];tp=null;
 if(Math.max(Math.abs(dx),Math.abs(dy))>24)cur.swipe(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0))},{passive:true});
let dip=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dip=e});
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
$("#back").onclick=()=>{S.game=null;render()};
$("#lang").onclick=()=>{S.lang=S.lang==="ar"?"en":"ar";pref();render()};
$("#snd").onclick=()=>{S.snd=!S.snd;pref();if(S.snd)sfx("lvl");render()};
document.addEventListener("keydown",e=>{if(e.target.matches("select,input"))return;
 const K={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3}[e.key];
 if(K!==undefined&&cur&&cur.swipe){e.preventDefault();cur.swipe(K);return}
 if((e.key==="r"||e.key==="R")&&S.game)start()});
render();
</script>
